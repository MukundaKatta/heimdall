[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heimdall-prompts"
version = "0.1.0"
description = "Heimdall — curated system prompt library with search, templates, and optimization. Ships a starter collection and a CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Mukunda Katta" }]
keywords = ["ai", "prompts", "llm", "prompt-engineering", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
heimdall = "heimdall.cli:main"

[project.urls]
Homepage = "https://github.com/MukundaKatta/heimdall"
Repository = "https://github.com/MukundaKatta/heimdall"

[tool.hatch.build.targets.wheel]
packages = ["src/heimdall"]

[tool.hatch.build.targets.wheel.shared-data]
"src/heimdall/data" = "heimdall/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
